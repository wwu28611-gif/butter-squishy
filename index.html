<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>鹹奶油捏捏模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout idea: a kitchen at night. One wooden table fills the screen, a dark signboard above, the drop buttons under the thumb. */
  :root {
    color-scheme: dark;
    --room: #2b1f1a;
    --ink: #1d1512;
    --paper: #f7efdf;
    --butter: #f4d960;
    --accent: #e2553a;
    --label: #2f6fb5;
    --font-display: "LXGW WenKai TC", "PingFang TC", "Microsoft JhengHei", serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--room);
    color: var(--paper);
    font-family: var(--font-body);
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    background: var(--ink);
    padding: 10px 16px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  }
  h1 { font-family: var(--font-display); font-size: 24px; line-height: 1; margin: 0; letter-spacing: .06em; color: var(--butter); }
  h1 small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 11px; letter-spacing: .2em; color: var(--paper); opacity: .6; margin-top: 6px; }
  .tally { display: flex; gap: 16px; align-items: flex-end; }
  .tally div { text-align: right; }
  .tally b { display: block; font-family: var(--font-display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
  .tally .left b { color: var(--butter); }
  .tally span { font-size: 11px; opacity: .7; letter-spacing: .08em; }

  #stage { position: relative; min-height: 0; }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hint {
    position: absolute; left: 16px; right: 16px; top: 12px; text-align: center;
    font-size: 14px; font-weight: 500; pointer-events: none; transition: opacity .5s;
    text-shadow: 0 1px 6px rgba(0,0,0,.7);
  }
  #hint.gone { opacity: 0; }
  #toast {
    position: absolute; left: 50%; bottom: 156px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 4px;
    font-size: 13px; max-width: calc(100% - 32px); text-align: center;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  /* manga-panel look for the guide and the battle banner: paper, heavy ink, offset shadow */
  #top { background: var(--ink); padding: 0 12px; }
  #tut {
    margin: 8px 5px 13px 0; display: flex; gap: 10px; align-items: center;
    background: #f6ecd2; color: #1b1512; border: 3px solid #1b1512; border-radius: 2px;
    box-shadow: 5px 5px 0 var(--accent); padding: 6px 8px 6px 6px; transform: rotate(-.5deg);
  }
  #tut[hidden] { display: none; }
  .mascot { flex: none; width: 58px; height: 58px; border: 3px solid #1b1512; }
  .bubble { flex: 1; min-width: 0; position: relative; background: #fff; border: 2.5px solid #1b1512; border-radius: 12px; padding: 6px 10px 7px; }
  .bubble::before { content: ""; position: absolute; left: -9px; top: 20px; width: 13px; height: 13px; background: #fff; border-left: 2.5px solid #1b1512; border-bottom: 2.5px solid #1b1512; transform: rotate(45deg); }
  #tut b { display: inline-block; background: #1b1512; color: var(--butter); font-family: var(--font-display); font-size: 12px; letter-spacing: .08em; padding: 1px 8px; transform: skewX(-10deg); }
  #tut p { margin: 4px 0 0; font-size: 14px; font-weight: 700; line-height: 1.4; }
  #tutBtn { flex: none; min-height: 36px; padding: 4px 8px; font-size: 12px; white-space: nowrap; background: #1b1512; color: #f6ecd2; border-color: #1b1512; border-radius: 2px; }
  .pulse { outline: 3px solid var(--paper); outline-offset: 2px; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { outline-offset: 7px; outline-color: rgba(247,239,223,.25); } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  footer { background: var(--ink); padding: 12px 16px 12px; display: grid; gap: 8px; }
  .tools { position: absolute; left: 8px; right: 8px; bottom: 8px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    padding: 6px; border-radius: 6px; background: rgba(29,21,18,.38); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .tools button { background: rgba(29,21,18,.35); border-color: rgba(247,239,223,.25); min-height: 46px; padding: 4px 2px; font-size: 12px; font-weight: 500; display: grid; justify-items: center; gap: 2px; }
  .tools svg { width: 22px; height: 22px; fill: currentColor; }
  .tools button[aria-pressed="true"] { background: rgba(247,239,223,.9); border-color: var(--paper); color: var(--ink); }
  .tools button:disabled { background: repeating-linear-gradient(-45deg, transparent 0 6px, rgba(247,239,223,.14) 6px 12px); text-decoration: line-through; }
  .drops { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; }
  button {
    font: inherit; color: var(--paper); background: transparent;
    border: 1.5px solid rgba(247,239,223,.3); border-radius: 4px;
    padding: 10px 8px; min-height: 48px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--butter); outline-offset: 2px; }
  button:disabled { opacity: .35; cursor: default; }
  #drop {
    background: var(--butter); border-color: var(--butter); color: var(--ink);
    font-family: var(--font-display); font-size: 19px; letter-spacing: .06em;
    box-shadow: 0 4px 0 #b39a2e;
  }
  #drop:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #b39a2e; }
  #dropAll, #restock { font-size: 14px; font-weight: 500; }
  #note { margin: 0; font-size: 12px; opacity: .7; }
  .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .meta button { min-height: 36px; padding: 4px 10px; font-size: 12px; }
  .meta b { color: var(--butter); }
  #ult { position: absolute; right: 12px; bottom: 74px; width: 70px; height: 70px; min-height: 0; border-radius: 50%; padding: 0;
    display: grid; place-content: center; font-size: 12px; font-weight: 700; line-height: 1.15; text-align: center;
    background: rgba(29,21,18,.6); border: 2px solid rgba(247,239,223,.35); }
  #ult b { display: block; font-family: var(--font-display); font-size: 19px; font-variant-numeric: tabular-nums; }
  #ult.ready { background: var(--butter) !important; color: var(--ink); border-color: #fff;
    box-shadow: 0 0 0 4px rgba(244,217,96,.35), 0 0 24px 6px rgba(244,217,96,.75); animation: ultglow .9s ease-in-out infinite; }
  @keyframes ultglow { 50% { box-shadow: 0 0 0 10px rgba(244,217,96,.12), 0 0 36px 14px rgba(244,217,96,.95); } }
  #ult.active { background: #2a5cff !important; border-color: #cfe0ff; color: #fff; font-size: 10px; box-shadow: 0 0 22px 6px rgba(80,140,255,.75); }
  #storm, #spMark { position: absolute; pointer-events: none; }
  #storm[hidden], #spMark[hidden] { display: none; }
  #storm { inset: 0; overflow: hidden; background: linear-gradient(to bottom, rgba(8,10,20,.78), rgba(8,10,20,.3) 45%, rgba(8,10,20,.12)); }
  #storm::before { content: ""; position: absolute; left: -60%; right: -60%; top: -40px; height: 170px;
    background: radial-gradient(closest-side, rgba(46,50,64,.97), transparent) 0 0 / 190px 130px repeat-x,
                radial-gradient(closest-side, rgba(26,28,38,.97), transparent) 95px 26px / 240px 140px repeat-x,
                radial-gradient(closest-side, rgba(60,64,80,.9), transparent) 40px 60px / 160px 100px repeat-x;
    animation: drift 14s linear infinite; }
  @keyframes drift { to { transform: translateX(22%); } }
  #storm::after { content: ""; position: absolute; inset: -60px 0 0; background: repeating-linear-gradient(100deg, transparent 0 15px, rgba(190,210,255,.2) 15px 16px);
    animation: rain .3s linear infinite; }
  @keyframes rain { to { transform: translate(-12px, 60px); } }
  #spMark { left: 0; top: 0; display: grid; justify-items: center; gap: 3px; will-change: transform; }
  .spname { background: #f6ecd2; color: #1b1512; border: 2.5px solid #1b1512; box-shadow: 3px 3px 0 var(--accent); font-size: 12px; font-weight: 700; padding: 2px 8px; white-space: nowrap; }
  .sphp { width: 86px; height: 9px; background: #fff; border: 2px solid #1b1512; }
  .sphp i { display: block; height: 100%; background: var(--accent); }
  .sparrow { color: var(--butter); font-size: 24px; line-height: 1; text-shadow: 0 2px 0 #1b1512; animation: bob .55s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(7px); } }
  @media (prefers-reduced-motion: reduce) { #storm::before, #storm::after, .sparrow, #ult.ready { animation: none; } }
  #alarm[hidden], #evui[hidden], #nuke[hidden], #panel[hidden] { display: none; }
  #alarm { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 70px 22px rgba(255,35,20,.9); animation: alarm .7s steps(2, jump-none) infinite; }
  @keyframes alarm { 50% { opacity: .15; } }
  @media (prefers-reduced-motion: reduce) { #alarm { animation: none; } }
  #evui {
    margin: 8px 5px 13px 0; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch;
    background: #f6ecd2; color: #1b1512; border: 3px solid #1b1512; border-radius: 2px;
    box-shadow: 5px 5px 0 var(--accent); padding: 6px 8px;
  }
  .evmain { display: grid; gap: 4px; min-width: 0; }
  .evtitle { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .evtitle b { font-family: var(--font-display); font-size: 22px; color: var(--accent); letter-spacing: .06em; transform: skewX(-8deg); -webkit-text-stroke: 1px #1b1512; }
  .evtitle span { font-size: 12px; font-weight: 700; }
  .hp { height: 14px; background: #fff; border: 2.5px solid #1b1512; overflow: hidden; }
  .hp i { display: block; height: 100%; width: 100%; background: var(--accent); }
  #hptext { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .nukebox { background: #1b1512; color: var(--butter); display: grid; align-content: center; justify-items: center; padding: 4px 10px; min-width: 78px; transform: rotate(2deg); }
  .nukebox small { font-size: 10px; letter-spacing: .15em; color: #f6ecd2; }
  #nuke { font-family: var(--font-display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
  #tapes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #tapes[hidden], #wstat[hidden], #award[hidden], #victory[hidden], #defeat[hidden], #defBtns[hidden], #adbox[hidden] { display: none; }
  #tapes i { position: absolute; background: repeating-linear-gradient(-45deg, #f4d960 0 12px, #1b1512 12px 24px); box-shadow: 0 2px 6px rgba(0,0,0,.55); }
  #tapes .v { top: 0; width: 14px; height: 100%; }
  #tapes .l { left: 0; } #tapes .r { right: 0; }
  #tapes .d { width: 240px; height: 20px; border-block: 2px solid #1b1512; }
  #tapes .d1 { top: 38px; left: -70px; transform: rotate(-38deg); }
  #tapes .d2 { top: 38px; right: -70px; transform: rotate(38deg); }
  #tapes .d3 { bottom: 38px; left: -70px; transform: rotate(38deg); }
  #tapes .d4 { bottom: 38px; right: -70px; transform: rotate(-38deg); }
  #wstat { position: absolute; left: 12px; bottom: 74px; min-height: 40px; padding: 4px 12px; font-size: 13px; font-weight: 700;
    background: var(--ink); border-color: var(--butter); color: var(--butter); font-variant-numeric: tabular-nums; }
  #wstat:disabled { opacity: .8; }
  /* title ceremony */
  #award { position: fixed; inset: 0; z-index: 6; background: rgba(12,8,6,.9); display: grid; place-items: center; padding: 20px; overflow: hidden; }
  .rays { position: absolute; left: 50%; top: 50%; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax;
    background: repeating-conic-gradient(rgba(244,217,96,.2) 0 10deg, transparent 10deg 20deg); animation: spin 16s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .medal { position: relative; text-align: center; display: grid; gap: 12px; justify-items: center; animation: stamp .55s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes stamp { from { transform: scale(3) rotate(-8deg); opacity: 0; } }
  .medal small { background: var(--accent); color: #fff; font-size: 14px; letter-spacing: .4em; padding: 6px 20px 6px 26px;
    clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%, 6% 50%); }
  .medal strong { font-family: var(--font-display); font-size: clamp(30px, 9vw, 46px); color: var(--butter); line-height: 1.25;
    text-shadow: 0 3px 0 #7a5d10, 0 0 28px rgba(244,217,96,.6); border-block: 3px double var(--butter); padding: 10px 8px; text-wrap: balance; }
  .medal p { margin: 0; font-size: 14px; opacity: .85; }
  .awbtns { display: flex; gap: 8px; margin-top: 8px; }
  .awbtns button { padding: 8px 16px; }
  #victory, #defeat { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: 20px; overflow: hidden; }
  #victory { background: rgba(12,8,6,.92); }
  #defeat { background: rgba(60,8,4,.92); }
  #victory .medal strong { font-size: clamp(44px, 14vw, 72px); letter-spacing: .08em; }
  #vstars { display: flex; gap: 10px; font-size: 46px; line-height: 1; }
  #vstars span { color: rgba(247,239,223,.2); }
  #vstars span.on { color: var(--butter); text-shadow: 0 0 18px rgba(244,217,96,.8); animation: stamp .45s cubic-bezier(.2,1.6,.4,1) both; }
  #vstats { margin: 0; display: grid; grid-template-columns: auto auto; gap: 4px 18px; font-size: 14px; text-align: left; }
  #vstats dt { opacity: .7; }
  #vstats dd { margin: 0; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  #vloot { color: var(--butter); font-weight: 700; opacity: 1; }
  .dbox { text-align: center; display: grid; gap: 12px; justify-items: center; }
  .dbox strong { font-family: var(--font-display); font-size: clamp(36px, 11vw, 56px); color: #fff; text-shadow: 0 3px 0 #5a120a; }
  .dbox p { margin: 0; font-size: 14px; }
  #revive { background: var(--butter); border-color: var(--butter); color: var(--ink); font-weight: 700; }
  #adbox { display: grid; gap: 6px; justify-items: center; font-size: 13px; }
  #adbox b { font-family: var(--font-display); font-size: 56px; color: var(--butter); line-height: 1; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { #vstars span.on { animation: none; } #vconf { display: none; } }
  #awardWear { background: var(--butter); border-color: var(--butter); color: var(--ink); font-weight: 700; }
  #confetti i, #vconf i { position: absolute; top: -24px; width: 8px; height: 14px; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .rays, .medal { animation: none; } #confetti { display: none; } }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #panel { position: fixed; inset: 0; z-index: 5; background: rgba(0,0,0,.62); display: grid; place-items: center; padding: 16px; }
  .sheet { background: var(--ink); border: 1.5px solid var(--butter); border-radius: 6px; width: min(100%, 420px); max-height: 100%; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  .sheet header { align-items: center; border-bottom: 1px solid rgba(247,239,223,.15); }
  .sheet h2 { margin: 0; font-family: var(--font-display); font-size: 20px; color: var(--butter); letter-spacing: .06em; }
  .sheet header button { min-height: 36px; padding: 4px 12px; font-size: 13px; }
  #panelBody { overflow-y: auto; padding: 12px 14px 16px; display: grid; gap: 8px; align-content: start; }
  #panelBody h3 { margin: 8px 0 0; font-size: 12px; letter-spacing: .15em; opacity: .6; font-weight: 500; }
  #panelBody > p { margin: 0; font-size: 14px; line-height: 1.6; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
  .row button { min-height: 40px; min-width: 96px; padding: 4px 12px; font-size: 13px; }
  .row b { color: var(--butter); }
  .card { display: flex; gap: 12px; align-items: center; border: 1px solid rgba(247,239,223,.18); border-radius: 4px; padding: 10px; text-align: left; width: 100%; min-height: 0; }
  .card.locked { opacity: .42; }
  .card.on { border-color: var(--butter); background: rgba(244,217,96,.1); }
  .card svg { flex: none; width: 56px; height: 44px; }
  .card b { display: block; font-size: 15px; }
  .card span { display: block; margin-top: 2px; font-size: 12px; opacity: .8; line-height: 1.5; }

  /* ===== shoujo manga skin: pastel pink and lavender, lace frames, sparkles, screen-tone dots ===== */
  :root {
    --sj-pink: #ff6fa5; --sj-hot: #ff3f86; --sj-soft: #ffd6e7; --sj-lav: #c9a2ff; --sj-plum: #5b2a4d; --sj-mauve: #a0628a;
    --font-display: "Huninn", "LXGW WenKai TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-body: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  body { background: #ffe9f1; color: var(--sj-plum); }
  header {
    background: radial-gradient(rgba(255,255,255,.55) 1.2px, transparent 1.6px) 0 0 / 9px 9px, linear-gradient(#ffcfe2, #ffe9f1);
    border-bottom: 3px double #ff9cc2; position: relative;
  }
  header::after { content: "✦　✧　✦"; position: absolute; right: 150px; top: 6px; color: #fff; font-size: 12px; letter-spacing: 2px; text-shadow: 0 0 6px #ff9cc2; pointer-events: none; }
  h1 { color: var(--sj-hot); text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 0 14px #ffb3d0; }
  h1 small { color: var(--sj-mauve); opacity: 1; text-shadow: none; }
  .tally b { color: #7a3b66; } .tally .left b { color: var(--sj-hot); }
  .tally span { color: var(--sj-mauve); opacity: 1; }
  #top { background: transparent; }
  #tut, #evui {
    background: #fff; color: var(--sj-plum); border: 2px solid #ff9cc2; border-radius: 22px; transform: none;
    box-shadow: 0 0 0 4px #fff, 0 0 0 6px #ffc6dc, 0 8px 18px rgba(255,110,160,.25); margin: 10px 6px 12px; position: relative;
  }
  #tut::after, #evui::after { content: "✦"; position: absolute; right: -6px; top: -12px; color: var(--sj-pink); font-size: 20px; text-shadow: 0 0 6px #fff; }
  .mascot { border: 0; border-radius: 50%; box-shadow: 0 0 0 3px #ffc6dc; }
  .bubble { background: #fff3f8; border: 2px dashed #ffb3d0; border-radius: 16px; }
  .bubble::before { background: #fff3f8; border-left: 2px dashed #ffb3d0; border-bottom: 2px dashed #ffb3d0; }
  #tut b { background: linear-gradient(90deg, #ff8fb8, var(--sj-lav)); color: #fff; transform: none; border-radius: 999px; padding: 1px 10px; }
  #tut p { color: var(--sj-plum); }
  #tutBtn { background: #fff; color: var(--sj-hot); border: 2px solid #ffb3d0; border-radius: 999px; }
  .evtitle b { color: var(--sj-hot); -webkit-text-stroke: 0; transform: none; text-shadow: 0 0 10px #ffc6dc; }
  .evtitle span, #hptext { color: var(--sj-mauve); }
  .hp { border: 2px solid #ff9cc2; border-radius: 999px; }
  .hp i { background: linear-gradient(90deg, #ff7aa8, #ffb3d0); border-radius: 999px; }
  .nukebox { background: linear-gradient(160deg, var(--sj-lav), #ff8fb8); color: #fff; border-radius: 16px; transform: none; }
  .nukebox small { color: #fff; }
  #alarm { box-shadow: inset 0 0 70px 22px rgba(255,40,120,.85); }
  #tapes i { background: repeating-linear-gradient(-45deg, #ff6fa5 0 12px, #fff 12px 24px); }
  #tapes .d { border-block: 2px solid #fff; }
  footer { background: radial-gradient(rgba(255,255,255,.5) 1.2px, transparent 1.6px) 0 0 / 9px 9px, linear-gradient(#ffe9f1, #ffd3e4); border-top: 3px double #ff9cc2; }
  button { color: #7a3b66; background: #fff; border: 2px solid #ffc0d8; border-radius: 999px; }
  button:focus-visible { outline-color: var(--sj-lav); }
  #drop { background: linear-gradient(#ff9cc2, var(--sj-pink)); border-color: #fff; color: #fff; box-shadow: 0 4px 0 #d9437c, 0 0 0 3px #ffc6dc; text-shadow: 0 1px 0 #d9437c; }
  #drop:active:not(:disabled) { box-shadow: 0 1px 0 #d9437c, 0 0 0 3px #ffc6dc; }
  #dropAll, #restock { color: var(--sj-hot); font-weight: 700; }
  #note { color: var(--sj-mauve); opacity: 1; }
  .meta b { color: var(--sj-hot); }
  .tools { background: rgba(255,240,247,.5); border: 2px solid rgba(255,255,255,.85); border-radius: 22px; }

    renderHud(); save();
    return true;
  }
  elDrop.addEventListener('click', function () { initAudio(); sndTick(); dropOne(); });
  elDropAll.addEventListener('click', function () {
    initAudio(); sndTick();
    var n = 10, i = 0;
    (function next() {
      if (i++ >= n || !dropOne()) return;
      setTimeout(next, 110);
    })();
  });
  function resetAll() {
    clearEvent();
    vicPending = false; elVic.hidden = true;
    removeAll();
    state.left = 30; state.count = 0; state.next = EVENT_AT; state.tut = 0;
    state.title = ''; state.titles = []; state.dex = []; state.spGot = []; state.ult = 0;
    if (ultK) endUlt();
    renderUlt();
    for (var k in state.stats) state.stats[k] = 0;
    try { localStorage.removeItem(KEY); } catch (e) {}
    renderHud(); renderTut(); save();
    toast('全部資料已重置');
  }

  /* ---------- loop ---------- */
  var lastT = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    try { step(t); } catch (err) { console.error(err); }
  }
  function step(t) {
    var dt = Math.min(1 / 30, (t - lastT) / 1000 || 1 / 60);
    lastT = t;
    updateActs(dt);
    updateEvent(dt);
    updateAd(dt);
    updateUlt(dt);
    if (!ev && state.count >= state.next) startEvent();
    for (var gi = 0; gi < butters.length; gi++) {
      var gb = butters[gi];
      if (!gb.grab) continue;
      var bp = gb.body.position, vx = (gb.grab.x - bp.x) * 12, vy = (gb.grab.y - bp.y) * 12, vz = (gb.grab.z - bp.z) * 12;
      var vl = Math.sqrt(vx * vx + vy * vy + vz * vz);
      if (vl > 14) { vx *= 14 / vl; vy *= 14 / vl; vz *= 14 / vl; }
      gb.body.wakeUp();
      gb.body.velocity.set(vx, vy, vz);
      gb.body.angularVelocity.scale(0.9, gb.body.angularVelocity);
    }
    world.step(1 / 60, dt, 3);
    for (var i = 0; i < butters.length; i++) updateButter(butters[i], dt);
    updateFlakes(dt);
    updateSpMark();
    renderer.render(scene, camera);
  }

  /* ---------- boot ---------- */
  function fail(msg) {
    elHint.textContent = msg; elHint.classList.remove('gone');
    elDrop.disabled = true; elDropAll.disabled = true;
  }
  function start(seed) {
    load(seed);
    renderHud(); renderTut(); renderUlt();
    if (!window.THREE || !window.CANNON) { fail('3D 元件載入失敗，請檢查網路後重新整理'); return; }
    try { initScene(); } catch (e) { fail('這個裝置或瀏覽器無法顯示 3D 畫面'); return; }
    var go = function () {
      if (under) return;
      buildUnder();
      var saved = state.butters.slice();
      for (var i = 0; i < saved.length; i++) makeButter(saved[i], true, i, state.flat[i], state.hp[i], state.kinds[i]);
      applyQuality();
      if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
      else window.addEventListener('resize', resize);
      requestAnimationFrame(frame);
    };
    // wait briefly for the label font so the printed text looks right
    if (document.fonts && document.fonts.load) {
      document.fonts.load('700 50px "Noto Sans TC"', 'BUTTER 鹹奶油').then(go, go);
      setTimeout(go, 1500);
    } else go();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { save(); return state; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
